name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    # ubuntu-latest (26.04) has no Python 3.9 build for setup-python
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # every version from the oldest supported (README: Python 3.9+) to the newest
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: python -VV
      - run: python -m pip install pytest
      - run: python -m pytest -q
